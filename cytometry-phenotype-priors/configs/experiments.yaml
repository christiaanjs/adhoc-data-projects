# Experiment configuration. Splits are by SAMPLE. Hyper-parameters marked (val) were chosen on the
# validation samples only (see results/grid_*.txt).
seeds: [0, 1, 2, 3, 4]
datasets:
  Samusik_all:
    kind: multi
    ref: ["01", "02", "03"]        # labelled reference pool (L5 only)
    val: ["04", "05"]
    test: ["06", "07", "08", "09", "10"]
    n_unknown: 6                   # (val)
  Levine_32dim:
    kind: multi
    ref: ["H1"]
    val: ["H1"]                    # only 2 samples: H1 serves as validation AND reference
    test: ["H2"]
    n_unknown: 6
  Mosmann_rare:
    kind: rare
    ref: []
    val: []
    test: ["S1"]                   # single sample: in-sample, unsupervised
    n_unknown: 15
  Nilsson_rare:
    kind: rare
    ref: []
    val: []
    test: ["S1"]
    n_unknown: 15
common:                            # shared by all torch mixtures
  steps: 400
  batch: 4096
  lr: 0.02
  lam: 10                          # (val) rule-gate strength; grid {1,3,10} on Samusik 04,05 + Levine H1
  tau: 0.6                         # (val) soft-threshold temperature; grid {0.3,0.6}
  gap_sigma: 2.0
  init: rules
methods:
  R_rules_classifier: {family: rules}   # baseline: soft gating with the rules alone, no mixture
  L0_gmm:            {family: gmm}
  L1_t:              {family: torch, dist: t}
  L2_flowsom:        {family: flowsom, k: 40}
  # t-mixture family: prior ablation {neither (=L1), order (=L3), rules, both (=L4)}
  L3_order:          {family: torch, dist: t, use_order: true}
  L3_order_rankinit: {family: torch, dist: t, use_order: true, init: rank}
  L4_rules:          {family: torch, dist: t, use_rules: true}
  L4_both:           {family: torch, dist: t, use_order: true, use_rules: true}
  # semi-supervised family (multi-sample sets only)
  L5_both_ref1:      {family: torch, dist: t, use_order: true, use_rules: true, n_ref: 1}
  L5_both_ref3:      {family: torch, dist: t, use_order: true, use_rules: true, n_ref: 3}
  L5_neither_ref3:   {family: torch, dist: t, n_ref: 3}
  L5_order_ref3:     {family: torch, dist: t, use_order: true, n_ref: 3}
  L5_rules_ref3:     {family: torch, dist: t, use_rules: true, n_ref: 3}
  # flow family
  L6_neither:        {family: torch, dist: gauss, flow: marginal+coupling}
  L6_order:          {family: torch, dist: gauss, flow: marginal+coupling, use_order: true}
  L6_rules:          {family: torch, dist: gauss, flow: marginal+coupling, use_rules: true}
  L6_both:           {family: torch, dist: gauss, flow: marginal+coupling, use_order: true, use_rules: true}
  L6_both_marginal:  {family: torch, dist: gauss, flow: marginal, use_order: true, use_rules: true}
  L6_both_unk0:      {family: torch, dist: gauss, flow: marginal+coupling, use_order: true, use_rules: true, n_unknown: 0}
  L6_both_unk1:      {family: torch, dist: gauss, flow: marginal+coupling, use_order: true, use_rules: true, n_unknown: 1}
